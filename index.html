<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <link rel="stylesheet" href="css/index.css">
        <!--「タブ」の画像-->
        <link rel="icon" href="images/favicon.png" type="image/png">
        <title>Harvest Restaurant</title>
    </head>

    <body class="topPage">
        <header>    
            <h1 class="top_logo">
                <img src="images/top_logo.png" alt="Harvest Restaurant">
            </h1>
            
            <nav class="gMenu">
                <input class="menu-btn" type="checkbox" id="menu-btn">
                <label class="menu-icon" for="menu-btn">
                    <span class="navicon"></span>
                </label>
                
                <ul class="menu">
                    <li><a href="menu.html">メニュー</a></li>
                    <li><a href="access.html">アクセス</a></li>
                    <li><a href="reservation.html">予約</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <p class="breadcrumb">
                <a href="index.html">ホーム</a>
            </p>
        
            <!-- 画像スライダー -->
            <section class="hero-slider">
                <div class="slider-window">
                    <button class="slider-btn prev" aria-label="前へ">‹</button>
                    <button class="slider-btn next" aria-label="次へ">›</button>
                    <div class="slider-track" id="sliderTrack">
                        <article class="slide">
                            <a href="product_html/weekday.html">
                                <img src="images/slider/weekday_images.png" alt="平日限定メニュー" loading="lazy">
                            </a>
                        </article>
                        <article class="slide">
                            <a href="menu.html">
                                <img src="images/slider/shaved_ice_images.png" alt="期間限定　かき氷" loading="lazy">
                            </a>
                        </article>
                        <article class="slide">
                            <a href="menu.html">
                                <img src="images/slider/cake_images_6.png" alt="季節限定　マスカット" loading="lazy">
                            </a>
                        </article>
                        <article class="slide">
                            <a href="menu.html">
                                <img src="images/slider/nugget_images.png" alt="一口ナゲット" loading="lazy">
                            </a>
                        </article>
                        <article class="slide">
                            <a href="reservation.html">
                                <img src="images/slider/reservation_images.png" alt="予約承っております" loading="lazy">
                            </a>
                        </article>
                    </div>
                </div>

                <div class="dots" id="dots">
                    <button class="dot active"></button>
                    <button class="dot"></button>
                    <button class="dot"></button>
                    <button class="dot"></button>
                    <button class="dot"></button>
                </div>
            </section>
            <script src="script/index.js"></script>
            
            <footer class="ft">
                <nav class="ft-nav">
                    <a href="menu.html">メニュー</a>
                    <a href="access.html">アクセス</a>
                    <a href="reservation.html">予約</a>
                </nav>
                <p class="ft-address">住所： 〒150-〇〇〇〇 東京都渋谷区〇〇 〇〇-〇〇</p>
                <p class="ft-address">営業時間 ： 11:00〜22:00</p>
                <div class="ft-logo">
                    <img src="images/bottom_logo.png" alt="Harvest Restaurant">
                </div>
                <p class="ft-copy">© 2025 Harvest Restaurant. All Rights Reserved.</p>
            </footer>
        </main>
    </body>
</html>
